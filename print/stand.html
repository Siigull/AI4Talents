<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>Jste tady — AI4Talents@FIT VUT</title>
  <meta name="description" content="Plakát na stojan „Jste tady“ pro AI4Talents@FIT VUT — pátek 6 . 11 . 2026, FIT VUT v Brně.">
  <!-- Print mode guard: must be set BEFORE map.js loads (inline script). -->
  <script>window.AI4T_PRINT_MODE = true;</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="../assets/css/print.css">
  <style>
    /* ============ A4 portrait "Jste tady" stand poster (print/stand.html?at=<roomId>) ============
       PRINT V2 (spec/PRINT-V2.md): the map renders the SAME decluttered style
       as the app v2 map — neutral white rooms + hairline ink strokes, event
       rooms #dbe7fa tint + bold mono labels, NO room-type colors, NO sector
       letters, NO pins, NO legend. THIS stand's room = yellow #ffff7f + 3px
       stroke. Static dashed magenta routes follow CORRIDOR CENTRES
       (AI4TRoute.corridorPath — medial-axis snap, "as a person walks").
       Exact paper size (210x297mm), no scrolling. */

    @page { size: 210mm 297mm; margin: 0; }
    html, body { width: 210mm; height: 297mm; }

    .page-stand { padding: 7mm 8mm; }

    /* ---------------------------------------------------------------- header */

    .st-head { border-bottom: 2px solid var(--ink); padding-bottom: 2.5mm; flex: none; }
    .st-head-top {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 6mm; margin-bottom: 1.5mm;
    }
    .st-kicker {
      font-family: var(--font-mono); font-size: 9.5pt; font-weight: 500;
      letter-spacing: .1em; text-transform: uppercase; color: var(--blue);
    }
    .st-date {
      font-family: var(--font-mono); font-size: 7pt; color: var(--ink-soft);
      white-space: nowrap;
    }
    .st-head-room { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4mm; }
    .st-code {
      font-family: var(--font-display); font-weight: 700; font-size: 42pt;
      line-height: 1; letter-spacing: -.01em; font-variant-numeric: tabular-nums;
    }
    .st-name {
      font-family: var(--font-display); font-weight: 500; font-size: 16pt;
      line-height: 1.1; max-width: 118mm;
    }
    .st-floor {
      margin-top: 1.5mm; font-family: var(--font-mono); font-size: 8pt;
      color: var(--ink-soft);
    }

    /* ------------------------------------------------------------------ map
       map.js (v2, print mode) renders into #map-root. Its own CSS is scoped
       to #map-root; overrides below must out-specify it (#poster prefix). */

    .st-main {
      flex: 1; min-height: 0; display: flex; gap: 5mm; padding-top: 3mm;
    }
    .st-mapcol { flex: 1; min-width: 0; display: flex; flex-direction: column; }

    #poster #map-root {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      width: auto; border-radius: 3px;
    }
    /* empty in print mode (floor buttons are stripped) — hide the bar */
    #poster #map-root .map-floorbar { display: none; }
    /* let the viewport fill the column instead of the 720/1000 aspect box */
    #poster #map-root .map-viewport {
      flex: 1; aspect-ratio: auto; height: auto; max-height: none;
      touch-action: auto; cursor: default;
    }

    /* THIS stand's room: yellow + 3px ink stroke (app v2 subject style) */
    #poster #map-root .room-g.st-subj .room {
      fill: var(--yellow);
      stroke: var(--ink);
      stroke-width: 3px;
    }

    /* "Jste tady" label beside the blue position marker */
    #poster #map-root .st-yah-label {
      font-family: var(--font-mono); font-size: 15px; font-weight: 500;
      fill: var(--blue); stroke: #fff; stroke-width: 3.5px; paint-order: stroke;
      pointer-events: none;
    }

    /* floor-change handover marker on a route fragment */
    #poster #map-root .st-hop rect {
      fill: var(--blue); stroke: #fff; stroke-width: 2px;
    }
    #poster #map-root .st-hop text {
      font-family: var(--font-mono); font-size: 14px; font-weight: 700; fill: #fff;
    }

    /* corridor-centre route: dashed magenta, one clean line (no halo) */
    #poster #map-root .st-route {
      fill: none; stroke: var(--magenta); stroke-width: 3px;
      stroke-dasharray: 7 5; stroke-linecap: round; stroke-linejoin: round;
      pointer-events: none;
    }
    /* first leg (tourist sign): solid, bolder, with an arrowhead — the sign
       only points the way OUT, the next sign takes over */
    #poster #map-root .st-leg { stroke-width: 4.5px; stroke-dasharray: none; }
    #poster #map-root .st-head { fill: var(--magenta); stroke: none; }
    /* destination ring at the end of a route (same floor only) */
    #poster #map-root .st-dest {
      fill: none; stroke: var(--magenta); stroke-width: 2.5px;
      pointer-events: none;
    }

    .st-mapcap { margin-top: 1.2mm; flex: none; }
    .st-mapcap .cap-strong { color: var(--ink); }

    /* ------------------------------------------------------------- side rail */

    .st-rail {
      flex: none; width: 50mm; display: flex; flex-direction: column; gap: 4mm;
      min-height: 0;
    }
    .rc-kicker {
      font-family: var(--font-mono); font-size: 6.5pt; font-weight: 500;
      letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft);
      border-bottom: 2px solid var(--ink); padding-bottom: 1mm;
    }

    /* ---- hlavní trasa: this stand's place on the designed route ---- */
    .mp-box {
      border: 2px solid var(--blue); border-radius: 2.5mm;
      padding: 2mm 2.2mm 1.6mm; margin-bottom: 3mm;
      background: var(--paper);
    }
    .mp-title {
      font-family: var(--font-mono); font-size: 7pt; font-weight: 500;
      letter-spacing: .1em; text-transform: uppercase; color: var(--blue);
      border-bottom: 1.5px solid var(--blue); padding-bottom: 1mm; margin-bottom: 1.2mm;
    }
    .mp-row { display: flex; gap: 2mm; align-items: baseline; font-size: 8pt; line-height: 1.4; margin-top: 0.7mm; }
    .mp-arrow { flex: none; font-family: var(--font-mono); font-weight: 700; color: var(--blue); }
    .mp-row--split .mp-arrow { color: var(--magenta-deep); }
    .mp-row--split { color: var(--magenta-deep); }
    .mp-sub { font-family: var(--font-mono); font-size: 6.5pt; color: var(--ink-soft); }

    /* ---- signboard: tourist-trail fingers — one line per DIRECTION ---- */
    .sg-line {
      display: flex; align-items: flex-start; gap: 2.5mm;
      padding: 1.6mm 0; border-bottom: 1px solid var(--hairline);
    }
    .sg-line:last-child { border-bottom: 0; }
    .sg-glyph {
      flex: none; width: 9mm; height: 9mm; display: flex; align-items: center;
      justify-content: center; font-size: 15pt; line-height: 1;
      background: var(--yellow); border: 2px solid var(--ink);
      border-radius: 2.5mm; font-family: var(--font-mono);
    }
    .sg-rooms { font-family: var(--font-mono); font-size: 10pt; font-weight: 700; line-height: 1.35; }
    .sg-sub { font-family: var(--font-mono); font-size: 6.5pt; color: var(--ink-soft); margin-top: 0.6mm; line-height: 1.35; }

    /* ---- nearby rooms: this sign is their final approach ---- */
    .nb-card { padding: 2mm 0 1.6mm; border-bottom: 1px solid var(--hairline); }
    .nb-card--here { background: var(--yellow); border: 2px solid var(--ink);
      border-radius: 2.5mm; padding: 2mm 2.2mm 1.8mm; margin-bottom: 1.5mm; }
    .nb-card:last-child { border-bottom: 0; }
    .nb-room { font-family: var(--font-mono); font-size: 8pt; }
    .nb-room b { font-size: 11pt; font-weight: 700; }
    .nb-room .nb-rn { color: var(--ink-soft); }
    .nb-evs { list-style: none; margin: 1.2mm 0 0; padding: 0; }
    .nb-evs li {
      display: flex; gap: 2mm; align-items: baseline;
      font-size: 7.5pt; line-height: 1.35; margin-top: 0.7mm;
    }
    .nb-t { flex: none; font-family: var(--font-mono); font-weight: 500; color: var(--blue); }

    .st-qr { margin-top: auto; }
    .st-qr .qr-slot { width: 28mm; height: 28mm; }
    .st-qr .qr-cap { max-width: 50mm; margin-top: 1.4mm; }

    /* ---------------------------------------------------------------- chips */

    .st-chips { margin-top: 3mm; flex: none; }
    .st-chips-label {
      font-family: var(--font-mono); font-size: 6.5pt; font-weight: 500;
      letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft);
      margin-bottom: 1.5mm;
    }
    .st-chip-row { display: flex; flex-wrap: wrap; gap: 1.6mm; }
    .st-chip {
      font-family: var(--font-mono); font-size: 7pt; line-height: 1;
      background: var(--paper); border: 1px solid var(--ink); border-radius: 3px;
      padding: 1.6mm 2.2mm; white-space: nowrap;
    }
    .st-chip b { color: var(--blue); font-weight: 500; }

    .pfooter { padding: 1.6mm 0 0; margin-top: 2.5mm; }

    /* unknown room fallback */
    .st-unknown { flex: 1; padding: 20mm 0; }
    .st-unknown h2 { font-family: var(--font-display); font-size: 30pt; font-weight: 700; }
    .st-unknown p { margin-top: 5mm; font-size: 12pt; max-width: 120mm; line-height: 1.45; }
  </style>
</head>
<body class="pp page-stand">
  <div id="poster" class="pp-root"></div>

  <script src="../assets/js/data.js" defer></script>
  <script src="../assets/js/routing.js" defer></script>
  <script src="../assets/js/map.js" defer></script>
  <script src="../assets/js/print.js" defer></script>
  <script>
    // stand.html boot — parametric "Jste tady" poster (?at=<roomId>).
    // map.js runs in AI4T_PRINT_MODE (static, chrome-less). Routes use
    // AI4TRoute.corridorPath (corridor centres). Runs after deferred libs.
    window.addEventListener('DOMContentLoaded', function () {
      var P = window.AI4TPrint;
      var MAP = window.AI4TMap;
      var RT = window.AI4TRoute;
      var DATA = window.AI4T_DATA;
      var root = document.getElementById('poster');
      if (!P) { root.textContent = 'Chybí data (AI4TPrint).'; return; }

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      // ------------------------------------------------------------ room id --

      var params = new URLSearchParams(location.search);
      var wanted = (params.get('at') || 'A101').trim();
      var info = P.findRoom(wanted);
      if (!info) {
        // Unknown room id — fallback sheet, still exactly A4.
        root.innerHTML =
          '<header class="st-head"><p class="st-kicker">Jste tady — you are here</p></header>' +
          '<div class="st-unknown"><h2>Místnost „' + esc(wanted) + '“ nebyla nalezena</h2>' +
          '<p>Zkontroluj parametr <span class="mono">?at=</span> v adrese — musí obsahovat ' +
          'číslo místnosti z mapy fakulty, např. <span class="mono">?at=A101</span>.</p></div>' +
          P.footerStrip();
        return;
      }
      var at = info.room.id; // canonical id
      var floor = info.floor;
      var floorLbl = P.floorLabel(floor);
      var meta = (DATA.events && DATA.events.meta) || {};

      document.title = 'Jste tady — ' + at + ' · AI4Talents@FIT VUT';

      // --------------------------------------------------------------- page --

      var h =
        '<header class="st-head">' +
          '<div class="st-head-top">' +
            '<p class="st-kicker">Jste tady — you are here</p>' +
            '<p class="st-date">PÁ ' + esc(P.fmtDate(meta.date)) + ' · ' +
              esc(meta.time || '9:00 — 14:00') + '</p>' +
          '</div>' +
          '<div class="st-head-room">' +
            '<h1 class="st-code">' + esc(at) + '</h1>' +
            '<p class="st-name">' + esc(info.room.name || '') + '</p>' +
          '</div>' +
          '<p class="st-floor">' + esc(floorLbl) + ' · ' +
            esc(meta.place || 'FIT VUT v Brně, Božetěchova 2') + '</p>' +
        '</header>' +

        '<main class="st-main">' +
          '<div class="st-mapcol">' +
            '<div id="map-root"></div>' +
            '<p class="st-mapcap map-cap" id="map-cap"></p>' +
          '</div>' +

          '<aside class="st-rail">' +
            '<div id="mainpath"></div>' +
            '<div>' +
              '<p class="rc-kicker">Kudy kam — následuj šipky</p>' +
              '<div id="signs"></div>' +
            '</div>' +
            '<div>' +
              '<p class="rc-kicker">Blízko tohoto stojanu</p>' +
              '<div id="nearby"></div>' +
            '</div>' +
            '<div class="st-qr">' + P.qrBlock(28, 'Naskenuj pro interaktivní mapu a program') + '</div>' +
          '</aside>' +
        '</main>' +

        '<section class="st-chips" aria-label="Program dne">' +
          '<p class="st-chips-label">Program — pátek ' + esc(P.fmtDate(meta.date)) + '</p>' +
          '<div class="st-chip-row" id="chips"></div>' +
        '</section>';

      root.innerHTML = h + P.footerStrip();

      // -------------------------------------------------------- the v2 map --

      if (MAP) {
        MAP.init('#map-root', { floor: floor });
        if (floor !== MAP.getFloor()) MAP.setFloor(floor);
      }

      // Position cell: routing anchor of the room (door cell), else the
      // room centroid snapped to the nearest walkable cell.
      var cell = null;
      var anchor = RT ? RT.anchorOf(at, floor) : null;
      if (anchor) {
        floor = anchor.floor; // trust the routing anchor's floor
        cell = [anchor.gx, anchor.gy];
      } else if (RT && info.room.c) {
        cell = RT.svgToCell(info.room.c);
        var near = RT.nearestWalkable(floor, cell);
        if (near) cell = near;
      }

      if (MAP && cell) MAP.setPosition({ floor: floor, cell: cell });

      // THIS room = subject: yellow + 3px stroke (overrides any event tint)
      function markSubject() {
        var g = document.querySelector('#map-world .room-g[data-id="' + at + '"]');
        if (g) g.setAttribute('class', 'room-g st-subj');
      }
      markSubject();

      // Bigger "Jste tady" dot + mono label beside it (kept from v1 — user
      // likes the marker; only the map style changed).
      if (MAP && cell && RT) {
        var layer = document.querySelector('#map-world .pos-layer');
        var core = layer && layer.querySelector('.pos-core');
        if (core) core.setAttribute('r', '11');
        if (layer) {
          var p = RT.cellToSvg(cell);
          // place BELOW the room so it never collides with the room-code label
          // at the centroid: anchor at the room's bbox bottom + 16 svg units
          var room = P.findRoom(at);
          var y = p[1] - 19;
          if (room && room.room && room.room.c) {
            var sb = null;
            for (var si = 0; si < (room.room.s || []).length; si++) {
              var sh = room.room.s[si];
              if (sh.r) {
                var btm = sh.r[1] + sh.r[3];
                if (sb === null || btm > sb) sb = btm;
              } else if (sh.p) {
                for (var pj = 0; pj < sh.p.length; pj++) {
                  if (sb === null || sh.p[pj][1] > sb) sb = sh.p[pj][1];
                }
              }
            }
            if (sb !== null) {
              var roomTop = null;
              for (var ti = 0; ti < (room.room.s || []).length; ti++) {
                var tsh = room.room.s[ti];
                var top = tsh.r ? tsh.r[1] : Math.min.apply(null, (tsh.p || []).map(function (q) { return q[1]; }));
                if (roomTop === null || top < roomTop) roomTop = top;
              }
              if (roomTop !== null && sb - roomTop > 70) y = sb - 10;
              else y = Math.min(sb + 18, 988);
            }
          }
          var yah = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          yah.setAttribute('class', 'st-yah-label');
          yah.setAttribute('text-anchor', 'middle');
          yah.textContent = 'Jste tady';
          layer.appendChild(yah);
          // candidate anchors around the default spot — pick the first that
          // clears every event-room code label (E104 sits right below E103)
          var labels = Array.prototype.slice.call(
            document.querySelectorAll('#map-world .ev-label'));
          var cands = [y, y + 26, y - 26, y + 52, y - 52];
          var chosen = cands[0];
          for (var ci = 0; ci < cands.length; ci++) {
            yah.setAttribute('x', p[0]); yah.setAttribute('y', cands[ci]);
            var bb = yah.getBBox();
            var hit = labels.some(function (lb) {
              var b2 = lb.getBBox();
              return bb.x < b2.x + b2.width && bb.x + bb.width > b2.x &&
                     bb.y < b2.y + b2.height && bb.y + bb.height > b2.y;
            });
            if (!hit) { chosen = cands[ci]; break; }
          }
          yah.setAttribute('x', p[0]); yah.setAttribute('y', chosen);
        }
      }

      // ---- rail autofit: content-heavy stands (mp-box + signboard + cards)
      // can push the QR past the main area into the chips row — zoom the
      // whole rail down until it fits (Chrome print pipeline only).
      var railAutofit = function () {
        var rail = document.querySelector('.st-rail');
        var main = document.querySelector('.st-main');
        var qr = document.querySelector('.st-qr');
        if (!rail || !main || !qr) return;
        rail.style.zoom = 1; // reset — fonts may have changed metrics
        var fits = function () {
          return qr.getBoundingClientRect().bottom <= main.getBoundingClientRect().bottom + 1;
        };
        for (var z = 1; z > 0.68 && !fits(); z -= 0.04) rail.style.zoom = z;
      };
      railAutofit();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(railAutofit);
      [400, 900, 1600].forEach(function (ms) { setTimeout(railAutofit, ms); });
      window.addEventListener('load', railAutofit);

      // ---- content crop: viewBox = union(subject, event rooms, route pts) ----
      // Kills dead zones: the poster shows the walkable neighbourhood of the
      // stand, not the whole floor. Same geometry as the app v2 cluster crop.
      (function cropToContent() {
        var svgEl = document.querySelector('#map-svg');
        var world = document.querySelector('#map-world');
        if (!svgEl || !world) return;
        var roomIds = new Set([at]);
        (DATA.events.events || []).forEach(function (ev) {
          if (String(ev.floor) === String(floor) && ev.room) roomIds.add(ev.room);
        });
        var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
        var grow = function (bx0, by0, bx1, by1) {
          x0 = Math.min(x0, bx0); y0 = Math.min(y0, by0);
          x1 = Math.max(x1, bx1); y1 = Math.max(y1, by1);
        };
        var idx = P.roomIndex();
        roomIds.forEach(function (id) {
          var info = idx[id];
          if (!info) return;
          (info.room.s || []).forEach(function (sh) {
            if (sh.r) grow(sh.r[0], sh.r[1], sh.r[0] + sh.r[2], sh.r[1] + sh.r[3]);
            else if (sh.p) sh.p.forEach(function (pt) { grow(pt[0], pt[1], pt[0], pt[1]); });
          });
        });
        document.querySelectorAll('#map-world .st-route').forEach(function (r) {
          (r.getAttribute('points') || '').trim().split(/[\s,]+/).forEach(function (n, i, arr) {
            if (i % 2) grow(+arr[i - 1], +n, +arr[i - 1], +n);
          });
        });
        if (x0 > x1) return;
        var mw = (x1 - x0) * 0.12, mh = (y1 - y0) * 0.12;
        x0 = Math.max(0, x0 - mw); y0 = Math.max(0, y0 - mh);
        x1 = Math.min(720, x1 + mw); y1 = Math.min(1000, y1 + mh);
        svgEl.setAttribute('viewBox', x0 + ' ' + y0 + ' ' + (x1 - x0) + ' ' + (y1 - y0));
      })();

      // "modrá = místnosti s programem" only when the floor actually
      // shows tinted event rooms (floor -2 / D0207 has none).
      var nEvRooms = document.querySelectorAll('#map-root .ev-label').length;
      document.getElementById('map-cap').innerHTML =
        '<span class="cap-strong">' + esc(floorLbl) + '</span>' +
        ' · žlutá = tento stojan' +
        ' · modrá čára = hlavní trasa' +
        ' · fialová = odbočka trasy' +
        (nEvRooms ? ' · modré místnosti = program' : '');

      // ---------------------------- tourist signs (v3) ----------------------
      // The poster works like trail signage: every DIRECTION gets one line
      // (one finger); the line only promises "leave this way" — the next
      // sign takes over. Rooms this sign is CLOSEST to get a full approach
      // path on the map + a detail card with their programme.

      var STANDS = ['A101', 'E103', 'C107', 'C106', 'C228', 'D106', 'A218', 'N105', 'R212'];

      // ---- hlavní trasa (designed route, both directions) ----
      (function renderMainPath() {
        var MP = (window.AI4T_DATA && window.AI4T_DATA.mainPath) || null;
        var el = document.getElementById('mainpath');
        if (!MP || !MP.stops || !el) return;
        var idx = -1;
        for (var i = 0; i < MP.stops.length; i++) if (MP.stops[i].room === at) { idx = i; break; }
        if (idx < 0) return;
        var stops = MP.stops;
        var next = stops[idx + 1], prev = stops[idx - 1];
        var h = '<div class="mp-box"><p class="mp-title">Hlavní trasa</p>';
        if (next) h += '<div class="mp-row"><span class="mp-arrow">→</span><span><b>' +
          esc(next.label) + '</b><br><span class="mp-sub">dál po trase</span></span></div>';
        if (prev) h += '<div class="mp-row"><span class="mp-arrow">←</span><span><b>' +
          esc(prev.label) + '</b><br><span class="mp-sub">zpět po trase</span></span></div>';
        var sp = stops[idx].split && MP.splits[stops[idx].split];
        if (sp) {
          h += '<div class="mp-row mp-row--split"><span class="mp-arrow">↳</span><span><b>' +
            esc(sp.label) + '</b><br><span class="mp-sub">' + esc(sp.hint) + '</span></span></div>';
        }
        h += '</div>';
        el.innerHTML = h;
      })();
      var DEST = []; // all event rooms worth pointing at
      (DATA.events.events || []).forEach(function (ev) {
        if (ev.room && DEST.indexOf(ev.room) < 0) DEST.push(ev.room);
      });
      var from = { roomId: at };
      if (cell) { from.floor = floor; from.cell = cell; }

      // path cache (corridorPath honours route-overrides.json)
      var PATHS = {};
      function pathTo(roomId) {
        if (!(roomId in PATHS)) {
          PATHS[roomId] = (roomId === at) ? null :
            (RT && RT.corridorPath ? RT.corridorPath(from, { roomId: roomId }) : null);
        }
        return PATHS[roomId];
      }

      // walk out of the room, then down the corridor until the first turn:
      // that stable heading is the direction this sign points.
      function firstLeg(leg) {
        var pts = leg.points;
        if (!pts || pts.length < 2) return null;
        var acc = 0, exitI = 0;
        for (var i = 1; i < pts.length && exitI === 0; i++) {
          acc += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);
          if (acc >= 40) exitI = i; // out of the door, into the corridor
        }
        if (!exitI) exitI = pts.length - 1;
        var h = [pts[exitI][0] - pts[0][0], pts[exitI][1] - pts[0][1]];
        var hl = Math.hypot(h[0], h[1]) || 1;
        var endI = exitI;
        for (var j = exitI + 1; j < pts.length; j++) {
          var seg = [pts[j][0] - pts[j-1][0], pts[j][1] - pts[j-1][1]];
          var sl = Math.hypot(seg[0], seg[1]) || 1;
          var dot = (h[0] * seg[0] + h[1] * seg[1]) / (hl * sl);
          if (dot < Math.cos(Math.PI / 5)) break; // a real turn — stop here
          endI = j;
          acc += sl;
          if (acc >= 190) break; // don't promise the whole route
        }
        return { exitI: exitI, endI: endI, heading: [h[0] / hl, h[1] / hl], pts: pts };
      }

      // 8-way glyph from the heading (map coords, y down; the map orients)
      function glyphOf(h) {
        var a = Math.atan2(h[1], h[0]) * 180 / Math.PI; // 0 = east, cw
        var G = ['\u2192', '\u2197', '\u2193', '\u2198', '\u2190', '\u2199', '\u2191', '\u2196'];
        var k = Math.round(((a + 360) % 360) / 45) % 8;
        return G[k];
      }

      // ---- build the signboard: group destinations by direction -----------
      var groups = {}; // key -> { glyph, rooms: [], floors: Set, leg }
      DEST.forEach(function (t) {
        if (t === at) return;
        var r = pathTo(t);
        if (!r || !r.legs || !r.legs.length) return;
        var leg = r.legs[0]; // first leg is on THIS floor, toward the target
        // (or toward the stairs when the target is on another floor)
        var fl = null, adjacent = false;
        if (!leg.points || leg.points.length < 2) {
          // degenerate route = the room is next door: geometric heading
          // between the two centroids, no corridor line to draw
          var ti = P.findRoom(t);
          if (ti && ti.room.c && info.room.c) {
            var dx = ti.room.c[0] - info.room.c[0], dy = ti.room.c[1] - info.room.c[1];
            var dl = Math.hypot(dx, dy) || 1;
            fl = { heading: [dx / dl, dy / dl], pts: [], endI: 0, adjacent: true };
            adjacent = true;
          }
        } else {
          fl = firstLeg(leg);
        }
        if (!fl) return;
        var other = null;
        var tFloor = P.findRoom(t);
        tFloor = tFloor ? tFloor.floor : floor;
        if (String(tFloor) !== String(floor)) other = tFloor;
        var key = (adjacent ? 'adj' : (other === null ? 'same' : 'up' + other)) + '|' + fl.heading[0].toFixed(2) + ',' + fl.heading[1].toFixed(2);
        var gk = adjacent ? '\u25c9' : glyphOf(fl.heading);
        if (!groups[key]) groups[key] = { glyph: gk, rooms: [], other: other, leg: fl, adjacent: adjacent };
        groups[key].rooms.push(t);
      });

      var signHtml = '';
      Object.keys(groups).map(function (k) { return groups[k]; })
        .sort(function (a, b) { return b.rooms.length - a.rooms.length; })
        .forEach(function (g) {
          var sub = '';
          if (g.adjacent) {
            sub = '<p class="sg-sub">hned vedle tohoto stojanu</p>';
          } else if (g.other !== null) {
            sub = '<p class="sg-sub">schodiště → ' + esc(P.floorLabel(g.other)) + '</p>';
          } else {
            sub = '<p class="sg-sub">dál tě dovedou další šipky</p>';
          }
          signHtml +=
            '<div class="sg-line">' +
              '<span class="sg-glyph">' + g.glyph + '</span>' +
              '<div><p class="sg-rooms">' + g.rooms.map(esc).join(' · ') + '</p>' + sub + '</div>' +
            '</div>';
        });
      if (!signHtml) signHtml = '<p class="rc-route-desc">Z tohoto stojanu nevedou žádné trasy.</p>';
      document.getElementById('signs').innerHTML = signHtml;

      // ---- nearby rooms: this stand is their closest sign ------------------
      var candidates = STANDS.slice();
      if (candidates.indexOf(at) < 0) candidates.push(at);
      var ownRooms = [];
      DEST.forEach(function (t) {
        if (t === at) return;
        var best = null, bestLen = Infinity;
        candidates.forEach(function (s) {
          // for THIS room use the cached path (door cell anchor — more
          // accurate); compare like any other candidate
          var p = (s === at) ? pathTo(t)
            : (RT ? RT.corridorPath({ roomId: s }, { roomId: t }) : null);
          if (p && p.length < bestLen) { best = s; bestLen = p.length; }
        });
        if (best === at) ownRooms.push(t);
      });

      var roomTitle = {}; // roomId -> short human line for cards
      (DATA.events.events || []).forEach(function (ev) {
        if (!roomTitle[ev.room]) roomTitle[ev.room] = [];
        roomTitle[ev.room].push(ev);
      });
      var nearHtml = '';
      var ownEvents = roomTitle[at] || [];
      if (ownEvents.length) {
        nearHtml +=
          '<div class="nb-card nb-card--here">' +
            '<p class="nb-room"><b>' + esc(at) + '</b> <span class="nb-rn">· zde — co se tu děje</span></p>' +
            '<ul class="nb-evs">' + ownEvents.map(function (ev) {
              return '<li><span class="nb-t">' + esc(ev.start) + '</span><span>' +
                esc(ev.title) +
                (ev.speaker || ev.partner ? ' — ' + esc(ev.speaker || ev.partner) : '') +
                '</span></li>';
            }).join('') + '</ul>' +
          '</div>';
      }
      ownRooms.forEach(function (t) {
        var fi = P.findRoom(t);
        var evs = roomTitle[t] || [];
        var lis = evs.map(function (ev) {
          return '<li><span class="nb-t">' + esc(ev.start) + '</span><span>' +
            esc(ev.title) +
            (ev.speaker || ev.partner ? ' — ' + esc(ev.speaker || ev.partner) : '') +
            '</span></li>';
        }).join('');
        nearHtml +=
          '<div class="nb-card">' +
            '<p class="nb-room"><b>' + esc(t) + '</b> <span class="nb-rn">· ' +
              esc(fi && fi.room.name || '') + '</span></p>' +
            '<ul class="nb-evs">' + lis + '</ul>' +
          '</div>';
      });
      if (!nearHtml) nearHtml = '<p class="rc-route-desc">Žádná místnost s programem není v blízkosti tohoto stojanu.</p>';
      document.getElementById('nearby').innerHTML = nearHtml;

      // ---- draw on the map: first legs (bold + arrowhead) + approaches -----
      if (MAP) {
        var layer = document.querySelector('#map-world .route-layer');
        if (layer) {
          var parts = [];
          var legTips = []; // arrowhead tips — dest rings must not sit on them
          // first legs — one per direction group
          Object.keys(groups).forEach(function (k) {
            var g = groups[k];
            if (g.adjacent) return; // next door — the ring on the map is enough
            var pts = g.leg.pts.slice(0, g.leg.endI + 1);
            if (pts.length < 2) return;
            var str = pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
            parts.push('<polyline class="st-route st-leg" points="' + str + '"/>');
            // arrowhead at the far end
            var a = pts[pts.length - 1], b = pts[pts.length - 2];
            var dx = a[0] - b[0], dy = a[1] - b[1], l = Math.hypot(dx, dy) || 1;
            var ux = dx / l, uy = dy / l; // along
            var vx = -uy, vy = ux;        // across
            var W = 12, Hw = 5.5;
            var tip = [a[0] + ux * 6, a[1] + uy * 6];
            legTips.push(tip);
            var left = [a[0] - ux * W + vx * Hw, a[1] - uy * W + vy * Hw];
            var right = [a[0] - ux * W - vx * Hw, a[1] - uy * W - vy * Hw];
            parts.push('<polygon class="st-route st-head" points="' +
              tip[0].toFixed(1) + ',' + tip[1].toFixed(1) + ' ' +
              left[0].toFixed(1) + ',' + left[1].toFixed(1) + ' ' +
              right[0].toFixed(1) + ',' + right[1].toFixed(1) + '"/>');
          });
          // approach paths to the rooms this sign serves (short by nature)
          ownRooms.forEach(function (t) {
            var r = pathTo(t);
            if (!r) return;
            var last = r.legs[r.legs.length - 1];
            r.legs.forEach(function (leg) {
              if (String(leg.floor) !== String(floor)) return;
              if (leg.points.length > 1) {
                parts.push('<polyline class="st-route" points="' +
                  leg.points.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') +
                  '"/>');
              }
            });
            if (String(last.floor) === String(floor) && last.points.length) {
              var end = last.points[last.points.length - 1];
              var onArrow = legTips.some(function (tp) {
                return Math.hypot(tp[0] - end[0], tp[1] - end[1]) < 24;
              });
              if (!onArrow) {
                parts.push('<circle class="st-dest" cx="' + end[0].toFixed(1) +
                  '" cy="' + end[1].toFixed(1) + '" r="10"/>');
              }
            }
          });
          layer.insertAdjacentHTML('beforeend', parts.join(''));
        }
      }

      // ------------------------------------------------------- event chips --

      // Short chip labels for events without speaker/partner (zones etc.);
      // everything else uses the surname / partner name, like
      // "9:00 Černocký — E112".
      var SHORT_TITLE = {
        'registrace': 'Registrace',
        'nabidka-stanky': 'Stánky firem',
        'prohlidky': 'Prohlídky fakulty',
        'kachna-obed-1': 'Oběd — Kachna', 'kachna-obed-2': 'Druhý oběd — Kachna'
      };
      function chipWho(ev) {
        if (ev.partner) return ev.partner;
        if (ev.speaker) {
          var words = String(ev.speaker).replace(/[„"«»]/g, ' ').trim().split(/\s+/);
          return words[words.length - 1];
        }
        return SHORT_TITLE[ev.id] || ev.title;
      }

      document.getElementById('chips').innerHTML = P.allEvents().map(function (ev) {
        return '<span class="st-chip"><b>' + esc(ev.start) + '</b> · ' +
          esc(chipWho(ev)) + ' — ' + esc(ev.room) + '</span>';
      }).join('');
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>AI4Talents — leták (A4 složený na A5)</title>
  <meta name="description" content="Kapesní leták AI4Talents@FIT VUT — A4 skládaný na A5: uvítání, mapa s hlavní trasou, program dopoledne a odpoledne.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../assets/css/print.css">
  <style>
    /* =====================================================================
       4×A5 folded leaflet on one A4 (duplex) — print/handout.html
       Sheet 1 (outer): [ MAP | FRONT ]   Sheet 2 (inner): [ DOPOLEDNE | ODPOLEDNE ]
       Mirrors letacek-inspirace.pdf: welcome text on the cover, map on the
       back of the folded leaflet, programme spread inside.
       Panels are A5 portrait; the sheet is A4 landscape, 1123×794px @96dpi.
       ===================================================================== */
    @page { size: 297mm 210mm; margin: 0; }
    html, body { width: 297mm; }
    .pp-root { display: block; }

    .sheet {
      width: 297mm; height: 210mm;
      display: grid; grid-template-columns: 1fr 1fr;
      background: var(--paper);
      position: relative;
      break-after: page;
    }
    .sheet:last-child { break-after: auto; }

    /* fold hint: hairline + tiny triangles at top/bottom center */
    .foldline {
      position: absolute; left: 50%; top: 0; bottom: 0; width: 0;
      border-left: 1px dashed rgba(20, 18, 15, 0.25);
      pointer-events: none;
    }
    .foldline::before, .foldline::after {
      content: ''; position: absolute; left: -3.5px;
      border-left: 3.5px solid transparent; border-right: 3.5px solid transparent;
    }
    .foldline::before { top: 0; border-top: 5px solid rgba(20, 18, 15, 0.45); }
    .foldline::after  { bottom: 0; border-bottom: 5px solid rgba(20, 18, 15, 0.45); }

    .panel {
      min-width: 0; min-height: 0;
      display: flex; flex-direction: column;
      padding: 8mm 7mm 7mm;
      overflow: hidden;
    }

    /* ------------------------------------------------------------ FRONT */
    .fr-brand { display: flex; align-items: baseline; gap: 3mm; }
    .fr-word { font-family: var(--font-display); font-weight: 700; font-size: 17pt; letter-spacing: -0.01em; }
    .fr-word .wm-4 { color: var(--blue); }
    .fr-date { font-family: var(--font-mono); font-size: 8pt; color: var(--ink-soft); margin-left: auto; }
    .fr-tag {
      margin-top: 2.5mm; font-family: var(--font-mono); font-size: 7.5pt;
      color: var(--ink-soft); letter-spacing: 0.06em;
    }
    .fr-when { margin-top: 1.2mm; font-family: var(--font-mono); font-size: 8pt; color: var(--ink); }

    .fr-hello { margin-top: 13mm; font-family: var(--font-display); font-weight: 600; font-size: 26pt; line-height: 1.08; }
    .fr-hello .wm-4 { color: var(--blue); }
    .fr-lines { margin-top: 8mm; display: flex; flex-direction: column; gap: 5mm; }
    .fr-line { display: flex; gap: 3mm; align-items: flex-start; }
    .fr-line::before {
      content: ''; flex: none; width: 2.4mm; height: 2.4mm; margin-top: 1.9mm;
      background: var(--blue); border-radius: 50%;
    }
    .fr-line p { font-size: 11.5pt; line-height: 1.42; }
    .fr-line b { font-weight: 600; }

    .fr-dod {
      margin-top: 9mm; border: 2px solid var(--ink); border-radius: 2.5mm;
      padding: 4.5mm 5mm; background: #fff;
    }
    .fr-dod .t { font-family: var(--font-display); font-weight: 600; font-size: 12pt; }
    .fr-dod .q { font-size: 10pt; line-height: 1.4; margin-top: 1.8mm; }
    .fr-dod .d { font-family: var(--font-mono); font-weight: 500; font-size: 10pt; margin-top: 2mm; }

    .fr-org {
      margin-top: auto; padding-top: 5mm;
      font-size: 9pt; line-height: 1.45; color: var(--ink);
      border-top: 2px solid var(--ink);
    }
    .fr-logos { display: flex; align-items: flex-end; justify-content: space-between; margin-top: auto; }
    .fr-logo { font-family: var(--font-display); font-weight: 700; font-size: 13pt; }
    .fr-logo small { display: block; font-family: var(--font-mono); font-weight: 400; font-size: 6.5pt; color: var(--ink-soft); margin-top: 0.8mm; letter-spacing: 0.08em; }
    .fr-logo--dnai { text-align: right; }
    .fr-logo--dnai b { color: var(--magenta-deep); }

    /* -------------------------------------------------------------- MAP */
    .mp-head { display: flex; align-items: baseline; justify-content: space-between; }
    .mp-title { font-family: var(--font-display); font-weight: 600; font-size: 14pt; }
    .floor-toggle { display: flex; gap: 1.5mm; }
    .floor-toggle button {
      font-family: var(--font-mono); font-size: 7pt; line-height: 1;
      padding: 1.6mm 2.2mm; background: #fff; color: var(--ink);
      border: 1.5px solid var(--ink); border-radius: 2mm; cursor: pointer;
    }
    .floor-toggle button.is-on { background: var(--blue); border-color: var(--ink); color: #fff; }
    @media print { .floor-toggle { display: none; } }

    .mp-mapbox { flex: 1; min-height: 0; margin-top: 2.5mm; }
    .mp-mapbox svg { width: 100%; height: 100%; display: block; }

    /* hlavní trasa overlay (svg units) */
    .pm-ov .l1 { fill: none; stroke: var(--blue); stroke-width: 4.5px; stroke-linecap: round; stroke-linejoin: round; }
    .pm-ov .l2 { fill: none; stroke: var(--blue); stroke-width: 4.5px; stroke-dasharray: 10 7; stroke-linecap: round; stroke-linejoin: round; }
    .pm-ov.show-1 .l2, .pm-ov.show-2 .l1 { opacity: 0.15; }
    .pm-ov .stub { fill: none; stroke: var(--magenta-deep); stroke-width: 3.5px; stroke-dasharray: 7 6; stroke-linecap: round; }
    .pm-ov .stop-c { fill: #fff; stroke: var(--blue); stroke-width: 3px; }
    .pm-ov .stop-c.reg { fill: var(--yellow); }
    .pm-ov .stop-c.split { stroke: var(--magenta-deep); }
    .pm-ov .stop-c.f2 { fill: var(--blue); }
    .pm-ov .stop-c.split.f2 + .stop-t, .pm-ov .stop-c.f2 + .stop-t { fill: #fff; }
    .pm-ov .stop-t { font: 700 20px 'IBM Plex Mono', monospace; fill: var(--blue); text-anchor: middle; dominant-baseline: central; }
    .pm-ov .stop-c.split + .stop-t { fill: var(--magenta-deep); }
    .pm-ov .hop-c { fill: var(--blue); stroke: #fff; stroke-width: 3px; }
    .pm-ov .hop-t { font: 700 22px 'IBM Plex Mono', monospace; fill: #fff; text-anchor: middle; dominant-baseline: central; }
    .pm-ov .lab { font: 500 15px 'IBM Plex Mono', monospace; fill: var(--blue); paint-order: stroke; stroke: #fff; stroke-width: 4px; }
    .pm-ov .lab--split { fill: var(--magenta-deep); }

    .mp-legend {
      flex: none; margin-top: 2mm; padding-top: 1.6mm; border-top: 1.5px solid var(--ink);
      font-family: var(--font-mono); font-size: 6.5pt; color: var(--ink);
      display: flex; flex-wrap: wrap; gap: 1mm 3mm;
    }
    .mp-legend i { display: inline-block; width: 6mm; height: 0; border-top: 2.5px solid var(--blue); vertical-align: middle; margin-right: 1mm; }
    .mp-legend i.dash { border-top-style: dashed; }
    .mp-legend i.mag { border-top-color: var(--magenta-deep); border-top-style: dashed; }
    .mp-legend .num { display: inline-flex; width: 3.4mm; height: 3.4mm; border: 1.5px solid var(--blue); border-radius: 50%; align-items: center; justify-content: center; font-size: 6pt; }
    .mp-legend .num--f2 { background: var(--blue); color: #fff; }

    .mp-route { margin-top: 2mm; font-size: 8pt; line-height: 1.45; }
    .mp-route b { font-family: var(--font-mono); font-weight: 500; }
    .mp-route .both { display: block; margin-top: 1.2mm; font-family: var(--font-mono); font-size: 7pt; color: #4a463f; }

    .mp-bottom { margin-top: 3mm; display: flex; gap: 4mm; align-items: flex-end; }
    .mp-qr { flex: none; }
    .mp-qr .qr-slot { width: 17mm; height: 17mm; }
    .mp-note { flex: 1; font-size: 8pt; line-height: 1.4; color: var(--ink); }
    .mp-note b { color: var(--blue); }
    .mp-foot {
      margin-top: 2.5mm; background: var(--ink); color: var(--paper);
      padding: 2.2mm 3mm;
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .mp-foot .w { font-family: var(--font-display); font-weight: 700; font-size: 11pt; }
    .mp-foot .w .wm-4 { color: #7db1f5; }
    .mp-foot .u { font-family: var(--font-mono); font-size: 7pt; color: #cfcac2; }

    /* --------------------------------------------------------- PROGRAM */
    .pr-head { flex: none; }
    .pr-title { font-family: var(--font-display); font-weight: 600; font-size: 14pt; }
    .pr-sub { font-family: var(--font-mono); font-size: 7pt; color: var(--ink-soft); margin-top: 0.6mm; }
    .pr-list { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 2.4mm; margin-top: 3mm; }

    .pev { border-left: 3px solid var(--ink-soft); padding-left: 2.4mm; }
    .pev.lecture { border-left-color: var(--blue); }
    .pev.workshop { border-left-color: var(--magenta-deep); }
    .pev-head { display: flex; baseline; justify-content: space-between; align-items: baseline; gap: 2mm; }
    .pev-time { font-family: var(--font-mono); font-weight: 700; font-size: 8.5pt; }
    .pev-room { font-family: var(--font-mono); font-size: 7pt; color: var(--ink-soft); text-align: right; }
    .pev-t { font-weight: 600; font-size: 9.5pt; line-height: 1.18; margin-top: 0.6mm; }
    .pev-m { font-family: var(--font-mono); font-size: 7pt; color: var(--ink); margin-top: 0.7mm; }
    .pev-d { font-size: 7.5pt; line-height: 1.34; color: var(--ink); margin-top: 0.9mm; }
    .pev-b {
      font-family: var(--font-mono); font-size: 6.5pt; line-height: 1.35; color: var(--ink);
      margin-top: 0.9mm; padding: 1.1mm 1.8mm; background: var(--yellow); border-radius: 1.2mm;
      display: inline-block;
    }
    .pev--lunch {
      border-left: 4px solid #c79a00; background: #fdf28d;
      border-radius: 0 1.5mm 1.5mm 0; padding: 1.5mm 2.4mm;
    }
    .pev--lunch .pev-d { margin-top: 0.7mm; }
    .pr-list { gap: 2mm; }
    .pr-bar {
      flex: none; font-family: var(--font-mono); font-size: 7pt; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      background: var(--ink); color: #fff; padding: 1.2mm 2mm; border-radius: 1.5mm;
      text-align: center;
    }
    .pr-bar--lunch { background: var(--yellow); color: var(--ink); letter-spacing: 0.04em; }
    .pr-par { display: grid; grid-template-columns: 1fr 1fr; gap: 2.4mm; }
    .pr-par .pev { min-width: 0; }
    .pr-end { margin-top: auto; }

    /* dopoledne has fewer entries — same type scale as odpoledne (the
       pages face each other when unfolded); the air is handled with
       separators, rhythm and real content, not bigger fonts */
    .pr--dopo .pr-list { gap: 3.2mm; justify-content: space-between; }
    .pr--dopo .pr-end { margin-top: 0; }
    .pr--dopo .pev ~ .pev {
      border-top: 1px solid rgba(20, 18, 15, 0.16);
      padding-top: 4.5mm;
    }
    .pr-tip {
      border: 2px solid var(--ink); border-radius: 2.5mm; background: #fff;
      padding: 3mm 4mm; font-size: 9pt; line-height: 1.4;
    }
    .pr-tip b { font-family: var(--font-mono); font-weight: 500; font-size: 7pt;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue); display: block; margin-bottom: 1mm; }
    .pr-lunchnote {
      font-size: 7.5pt; line-height: 1.38; color: var(--ink);
      margin-top: 1.6mm; text-align: center;
    }
    .pr--dopo .pev-time { font-size: 10.5pt; }
    .pr--dopo .pev-room { font-size: 8pt; }
    .pr--dopo .pev-t { font-size: 13pt; }
    .pr--dopo .pev-m { font-size: 8.5pt; }
    .pr--dopo .pev-d { font-size: 10.5pt; line-height: 1.4; }
    .pr--dopo .pr-bar { font-size: 8pt; padding: 1.8mm 2mm; }
  </style>
</head>
<body class="pp page-handout">
  <div id="poster" class="pp-root"></div>

  <script src="../assets/js/data.js" defer></script>
  <script src="../assets/js/routing.js" defer></script>
  <script src="../assets/js/print.js" defer></script>
  <script>
    // Leták boot — 4×A5 panels on 2 A4-landscape sheets (duplex + fold).
    window.addEventListener('DOMContentLoaded', function () {
      var P = window.AI4TPrint;
      var DATA = window.AI4T_DATA;
      var root = document.getElementById('poster');
      if (!P) { root.textContent = 'Chybí data (AI4TPrint).'; return; }
      var meta = (DATA.events && DATA.events.meta) || {};
      var esc = P.esc;
      var evs = P.allEvents();
      function byId(id) { return evs.filter(function (e) { return e.id === id; })[0]; }
      function who(ev) { return ev.speaker || ev.partner || ''; }
      function minOf(t) {
        var m = /^(\d{1,2}):(\d{2})$/.exec(String(t || ''));
        return m ? (+m[1]) * 60 + (+m[2]) : 0;
      }

      // official long texts (timetable.txt / workshops_email.txt) — the
      // programme pages carry them in full; only minor edits allowed
      var LONG_DESC = {
        'workshop-security':
          'Úprava jediného faktu ve velkém jazykovém modelu obvykle připomíná operaci srdce kladivem. Přetrénování je pomalé a drahé a často naruší chování, které s úpravou vůbec nesouvisí. ROME (Rank-One Model Editing) nabízí chirurgicky přesnější alternativu: s vahami modelu zachází jako s databází, kterou lze aktualizovat přímo na místě. V tomto praktickém workshopu si celou operaci provedete sami.' +
          ' Workshop vychází z probíhajícího výzkumu Red Hatu a FIT VUT v oblasti forenzní analýzy umělé inteligence a krok za krokem vás provede naším open-source nástrojem. Nejprve přepíšete fakt v modelu jedinou úpravou (rank-one), jejíž aplikace trvá jen pár sekund. Poté pacienta vyšetříte. Drží nový fakt, i když otázku přeformulujete? A co dalšího se omylem změnilo? Pak přejdete na druhou stranu a zahrajete si na útočníka. Do modelu podstrčíte nepravdivý fakt a uvidíte, jak přesvědčivě ho opakuje, zatímco se jinak chová zcela normálně. Cestou metodu dotlačíme až k bodu, kdy selže, abyste na vlastní oči viděli, kde přestávají platit předpoklady ROME. Nakonec si vyzkoušíte náš prototyp pro detekci upravených modelů a zjistíte, zda lze takovou manipulaci odhalit.',
        'prednaska-cernocky': 'Jak AI mění svět kolem nás – a jaká v ní může být tvoje role.'
      };

      /* ------------------------------------------------------- FRONT panel
         same text as letacek-inspirace.pdf */
      var front =
        '<section class="panel">' +
          '<div class="fr-brand"><p class="fr-word">AI<span class="wm-4">4</span>Talents</p>' +
            '<p class="fr-date">2026</p></div>' +
          '<p class="fr-tag">Akce pro středoškolské nadšence do umělé inteligence</p>' +
          '<p class="fr-when">pátek 6. listopadu 2026 · ' + esc(meta.time) + ' · ' + esc(meta.place) + '</p>' +
          '<h1 class="fr-hello">Vítáme vás na<br>AI<span class="wm-4">4</span>Talents</h1>' +
          '<div class="fr-lines">' +
            '<div class="fr-line"><p>Prosíme o dodržování účasti na registrované workshopy a přednášky.</p></div>' +
            '<div class="fr-line"><p>Pokud něco nevíte, zeptejte se na místě registrace.</p></div>' +
            '<div class="fr-line"><p>Obědová pauza 11:10–12:00 v klubu U Kachničky (možnost koupení toastu a kofoly / sníst si vlastní jídlo).</p></div>' +
          '</div>' +
          '<div class="fr-dod">' +
            '<p class="t">Dny otevřených dveří</p>' +
            '<p class="q">Chtěl by ses dozvědět víc o studiu na naší fakultě?</p>' +
            '<p class="d">27. 11. 2026 · 29. 1. 2027 · 26. 2. 2027</p>' +
          '</div>' +
          '<p class="fr-org">Akce je organizována Fakultou informačních technologií VUT a je součástí festivalu umělé inteligence Dny&nbsp;AI&nbsp;2026.</p>' +
          '<div class="fr-logos">' +
            '<p class="fr-logo">FIT&nbsp;VUT<small>V BRNĚ · BOŽETĚCHOVA 2</small></p>' +
            '<p class="fr-logo fr-logo--dnai"><b>Dny&nbsp;AI</b><small>2026</small></p>' +
          '</div>' +
        '</section>';

      /* --------------------------------------------------------- MAP panel
         (back cover of the folded leaflet) */
      var mapPanel =
        '<section class="panel">' +
          '<div class="mp-head"><p class="mp-title">Mapa — hlavní trasa</p>' +
            '<div class="floor-toggle" role="group" aria-label="Zvýraznit patro">' +
              '<button type="button" data-fl="1">1. patro</button>' +
              '<button type="button" data-fl="2">2. patro</button>' +
              '<button type="button" data-fl="all" class="is-on">obojí</button>' +
            '</div></div>' +
          '<div class="mp-mapbox" id="lt-map"></div>' +
          '<p class="mp-legend">' +
            '<span><i></i>1. patro</span><span><i class="dash"></i>2. patro</span>' +
            '<span><i class="mag"></i>odbočky (D0207, N105)</span>' +
            '<span><span class="num">1</span> zastávka 1. patra</span>' +
            '<span><span class="num num--f2">1</span> zastávka 2. patra</span>' +
            '<span style="margin-left:auto">žlutá = registrace</span>' +
          '</p>' +
          '<p class="mp-route"><b>C107</b> registrace → <b>E103</b> stánky → <b>C106</b> → <b>C228</b> workshopy → ' +
            '<b>D106</b> ·odbočka dolů D0207· → <b>A218</b> → most ·odbočka N105· → <b>R212</b> Kachna' +
            '<span class="both">Trasa je značená šipkami na stojanech a funguje oběma směry.</span></p>' +
          '<div class="mp-bottom">' +
            '<div class="mp-qr">' + P.qrBlock(17, 'Naskenuj pro interaktivní mapu a program') + '</div>' +
            '<p class="mp-note"><b>Program i mapa</b> se ti vejdou do kapsy — naskenuj QR kód a měj vše po ruce.</p>' +
          '</div>' +
          '<div class="mp-foot"><p class="w">AI<span class="wm-4">4</span>Talents@FIT VUT</p><p class="u">siigull.github.io/AI4Talents</p></div>' +
        '</section>';

      /* ------------------------------------------------------ PROGRAM pages */
      function evBlock(ev, opts) {
        opts = opts || {};
        var desc = LONG_DESC[ev.id] || ev.desc || '';
        return '<article class="pev ' + esc(ev.type) + '">' +
          '<div class="pev-head"><p class="pev-time">' + esc(ev.start) + '–' + esc(ev.end) + '</p>' +
            '<p class="pev-room">' + esc(ev.room) + ' · ' + esc(P.floorLabel(ev.floor)) + '</p></div>' +
          '<p class="pev-t">' + esc(ev.title) + '</p>' +
          (who(ev) ? '<p class="pev-m">' + esc(who(ev)) + '</p>' : '') +
          (desc ? '<p class="pev-d">' + esc(desc) + '</p>' : '') +
          (ev.bring && !opts.noBring ? '<p class="pev-b">Přines si: ' + esc(ev.bring) + '</p>' : '') +
        '</article>';
      }

      // dopoledne — until the lunch break
      var reg = byId('registrace'), stanky = byId('nabidka-stanky');
      var cernocky = byId('prednaska-cernocky');
      var sekanina = byId('prednaska-sekanina'), bezpec = byId('prednaska-bezpecnost');
      var dopoledne =
        '<section class="panel pr--dopo">' +
          '<header class="pr-head"><p class="pr-title">Program — dopoledne</p>' +
            '<p class="pr-sub">pátek 6. 11. 2026 · 8:30–12:00 · vstup zdarma po registraci</p></header>' +
          '<div class="pr-list">' +
            '<article class="pev ' + esc(reg.type) + '">' +
              '<div class="pev-head"><p class="pev-time">' + esc(reg.start) + '–' + esc(reg.end) + '</p>' +
                '<p class="pev-room">' + esc(reg.room) + ' · ' + esc(P.floorLabel(reg.floor)) + '</p></div>' +
              '<p class="pev-t">' + esc(reg.title) + '</p>' +
              '<p class="pev-d">' + esc(reg.desc) + '</p>' +
            '</article>' +
            evBlock(stanky) +
            evBlock(cernocky) +
            '<p class="pr-bar">10:10–11:10 · současně na dvou místech</p>' +
            evBlock(sekanina, { noBring: true }) +
            evBlock(bezpec, { noBring: true }) +
            '<article class="pev pev--lunch">' +
              '<div class="pev-head"><p class="pev-time">11:10–12:00</p>' +
                '<p class="pev-room">Kachna · R212 · 2. patro</p></div>' +
              '<p class="pev-t">Přestávka na oběd</p>' +
              '<p class="pev-d">Vyrazit na oběd můžeš i mimo fakultu, ale nemusíš — studentský klub U Kachničky je přímo tady: toasty a točená Kofola za studentské ceny. Druhý oběd 14:00–16:00.</p>' +
            '</article>' +
          '</div>' +
        '</section>';

      // odpoledne — workshops, tours, second lunch
      var proh1 = byId('prohlidky-1'), proh2 = byId('prohlidky-2');
      var redhat = byId('workshop-redhat'), solar = byId('workshop-solarwinds');
      var sap = byId('workshop-sap'), sec = byId('workshop-security');
      var odpoledne =
        '<section class="panel">' +
          '<header class="pr-head"><p class="pr-title">Program — odpoledne</p>' +
            '<p class="pr-sub">workshopy · prohlídky · 12:00–16:00 · kapacity workshopů jsou omezené</p></header>' +
          '<div class="pr-list">' +
            '<article class="pev zone">' +
              '<div class="pev-head"><p class="pev-time">12:00–14:00</p>' +
                '<p class="pev-room">' + esc(proh1.room) + ' · ' + esc(P.floorLabel(proh1.floor)) + '</p></div>' +
              '<p class="pev-t">Prohlídka fakulty — dvě kola</p>' +
              '<p class="pev-m">1. kolo 12:00 · 2. kolo 13:00 · sraz ' + esc(proh1.room) + '</p>' +
              '<p class="pev-d">' + esc(proh1.desc) + '</p>' +
            '</article>' +
            evBlock(redhat) +
            evBlock(solar) +
            evBlock(sap) +
            evBlock(sec) +
            '<article class="pev pev--lunch">' +
              '<div class="pev-head"><p class="pev-time">14:00–16:00</p>' +
                '<p class="pev-room">Kachna · R212 · 2. patro</p></div>' +
              '<p class="pev-t">Druhý oběd — Kachna je otevřená znovu</p>' +
            '</article>' +
          '</div>' +
        '</section>';

      /* ------------------------------------------------------------ sheets */
      root.innerHTML =
        '<div class="sheet"><div class="foldline"></div>' + mapPanel + front + '</div>' +
        '<div class="sheet"><div class="foldline"></div>' + dopoledne + odpoledne + '</div>';

      /* ------------------------------------------- map panel: route overlay */
      (function drawMap() {
        var box = document.getElementById('lt-map');
        if (!box) return;
        var svg = P.miniMap({
          floor: '1',
          crop: { buildings: true, margin: 10 },
          aspect: (box.clientWidth || 400) / (box.clientHeight || 500),
          boxMm: (box.clientWidth || 400) * 25.4 / 96,
          labelPx: 9
        });
        if (!svg) { box.textContent = 'Mapu se nepodařilo vykreslit.'; return; }
        box.appendChild(svg);
        var MP = DATA.mainPath;
        if (!MP.legs) return;

        var NS = 'http://www.w3.org/2000/svg';
        var g = document.createElementNS(NS, 'g');
        g.setAttribute('class', 'pm-ov');
        var el = function (name, attrs, txt) {
          var e = document.createElementNS(NS, name);
          for (var k in attrs) e.setAttribute(k, attrs[k]);
          if (txt != null) e.textContent = txt;
          g.appendChild(e);
          return e;
        };

        var poly = function (pts, cls) {
          if (!pts || pts.length < 2) return;
          el('polyline', { class: cls,
            points: pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') });
        };

        // main legs: floor 1 solid, floor 2 dashed; hop marker at floor changes
        var hopPts = [];
        MP.legs.forEach(function (leg, i) {
          var cls = String(leg.floor) === '2' ? 'l2' : 'l1';
          poly(leg.points, cls);
          var next = MP.legs[i + 1];
          if (leg.stairs && next) {
            var at = next.points[0] || leg.points[leg.points.length - 1];
            hopPts.push(at);
            el('circle', { class: 'hop-c', cx: at[0], cy: at[1], r: 19 });
            var up = Number(next.floor) > Number(leg.floor);
            el('text', { class: 'hop-t', x: at[0], y: at[1] + 1 }, up ? '↑' : '↓');
          }
        });

        // split stubs (~140 svg units along the branch) + labels
        Object.keys(MP.splits || {}).forEach(function (k) {
          var sp = MP.splits[k];
          var first = sp.legs && sp.legs.find(function (l) { return l.points && l.points.length > 1; });
          if (!first) return;
          var acc = 0, pts = [first.points[0], first.points[1]]; // min. 2 pts
          for (var i = 2; i < first.points.length && acc < 140; i++) {
            acc += Math.hypot(first.points[i][0] - first.points[i-1][0], first.points[i][1] - first.points[i-1][1]);
            pts.push(first.points[i]);
          }
          poly(pts, 'stub');
          var end = pts[pts.length - 1];
          el('text', { class: 'lab lab--split', x: Math.min(end[0] + 10, 640), y: end[1] - 12 },
            k.toUpperCase() + ' ↓');
        });

        // numbered stops (svg units, mono digits); a room label is drawn only
        // when the base map doesn't already label that room (event rooms do)
        var eventRoomIds = {};
        (DATA.events.events || []).forEach(function (ev) { eventRoomIds[ev.room] = 1; });
        (MP.stops || []).forEach(function (s, i) {
          if (String(s.floor) !== '2' && String(s.floor) !== '1') return;
          // a stop sitting on a floor-change hop marker (C106 = at the C110
          // stairs) steps aside, so the two circles never fuse into one blob
          var sx = s.at[0], sy = s.at[1];
          if (hopPts.some(function (p) { return Math.hypot(p[0] - sx, p[1] - sy) < 24; })) sx -= 36;
          el('circle', {
            class: 'stop-c' + (s.kind === 'reg' ? ' reg' : s.kind === 'split' ? ' split' : '') +
              (String(s.floor) === '2' ? ' f2' : ''),
            cx: sx, cy: sy, r: s.kind === 'split' ? 14 : 12
          });
          el('text', { class: 'stop-t', x: sx, y: sy + 1 }, String(i + 1));
          if (s.room && !eventRoomIds[s.room]) {
            el('text', { class: 'lab', x: sx + 16, y: sy + 22 },
              s.room + (String(s.floor) === '2' ? ' · 2.p' : ' · 1.p'));
          }
        });

        svg.appendChild(g);
        // never clip the overlay: grow the viewBox to cover stops + stubs
        // (getBBox needs the group rendered, hence append first)
        var bb = g.getBBox();
        var vb = (svg.getAttribute('viewBox') || '0 0 720 1000').split(/\s+/).map(Number);
        var pad = 26;
        var nx = Math.max(0, Math.min(vb[0], bb.x - pad));
        var ny = Math.max(0, Math.min(vb[1], bb.y - pad));
        var nx1 = Math.min(720, Math.max(vb[0] + vb[2], bb.x + bb.width + pad));
        var ny1 = Math.min(1000, Math.max(vb[1] + vb[3], bb.y + bb.height + pad));
        svg.setAttribute('viewBox', nx + ' ' + ny + ' ' + (nx1 - nx) + ' ' + (ny1 - ny));

        // dynamic floor emphasis (screen only; print shows both)
        var ovl = g;
        document.querySelectorAll('.floor-toggle button').forEach(function (btn) {
          btn.addEventListener('click', function () {
            document.querySelectorAll('.floor-toggle button').forEach(function (b) { b.classList.remove('is-on'); });
            btn.classList.add('is-on');
            ovl.classList.remove('show-1', 'show-2');
            var fl = btn.getAttribute('data-fl');
            if (fl === '1') ovl.classList.add('show-1');
            if (fl === '2') ovl.classList.add('show-2');
          });
        });
      })();
    });
  </script>
</body>
</html>
